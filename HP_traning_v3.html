<body><div class="container">
<header><div class="brand">HP-träning</div><div class="tag">ORD + meningskomplettering</div></header>
<section id="home" class="card">
<h1>Träna som på högskoleprovet.</h1>
<p class="lead">Välj mellan ordförståelse och meningskomplettering. I meningsläget väljer du det alternativ med ett, två eller tre ord som passar bäst i luckorna.</p>
<div class="modegrid">
<button class="mode active" data-mode="word"><b>Ordförståelse</b><span>Ett ord och fem definitioner. Endast en definition är rätt.</span></button>
<button class="mode" data-mode="sentence"><b>Meningskomplettering</b><span>En eller flera meningar med 1–3 luckor och fem svarsalternativ.</span></button>
</div>
<div class="controls">
<div class="control"><label>ANTAL FRÅGOR</label><select id="count"><option>10</option><option>15</option><option>20</option></select></div>
<div class="control"><label>SVÅRIGHET</label><select id="difficulty"><option value="0">Blandat</option><option value="1">Enkel</option><option value="2">Medelsvår</option><option value="3">Svår</option><option value="4">Väldigt svår</option><option value="5">Sinnesjuk</option></select></div>
</div>
<button class="primary" id="start">Starta förhör →</button><p class="small" id="bankInfo"></p>
</section>
<section id="quiz" class="card hidden">
<div class="topline"><span id="counter"></span><span id="liveScore">0 rätt</span></div><div class="progress"><div class="bar" id="bar"></div></div>
<div id="questionType" class="badge"></div><div id="word" class="word hidden"></div><div id="sentence" class="sentence hidden"></div><div id="answers" class="answers"></div><div id="feedback" class="feedback"></div><div class="nav"><button id="next" class="secondary" disabled>Nästa →</button></div>
</section>
<section id="result" class="card hidden"><div class="result"><div class="small">DITT RESULTAT</div><div class="score" id="score"></div><div id="resultText" class="lead" style="margin:auto"></div><div class="statgrid"><div class="stat"><b id="correctStat"></b><span class="small">rätt</span></div><div class="stat"><b id="wrongStat"></b><span class="small">fel</span></div><div class="stat"><b id="percentStat"></b><span class="small">procent</span></div></div></div><div class="review"><h2>Rättning</h2><div id="reviewList"></div></div><button id="again" class="primary">Gör ett nytt förhör</button></section>
</div>

let selectedMode="word",quiz=[],index=0,score=0,answered=false,results=[];
const $=id=>document.getElementById(id),labels={1:"Enkel",2:"Medelsvår",3:"Svår",4:"Väldigt svår",5:"Sinnesjuk"};
const shuffle=a=>[...a].sort(()=>Math.random()-.5);
function updateInfo(){const d=Number($("difficulty").value),t=d===0?"Blandat":labels[d];$("bankInfo").textContent=selectedMode==="word"?`Ordbank: ${BANK.length} ord • ${t}`:`Meningsbank: ${MEK.length} frågor • 1–3 luckor • ${t}`;}
document.querySelectorAll(".mode").forEach(btn=>btn.onclick=()=>{selectedMode=btn.dataset.mode;document.querySelectorAll(".mode").forEach(x=>x.classList.remove("active"));btn.classList.add("active");updateInfo();});
$("difficulty").onchange=updateInfo;updateInfo();
function makeQuiz(){const d=Number($("difficulty").value),n=Number($("count").value);const source=selectedMode==="word"?BANK:MEK;const eligible=d===0?source:source.filter(x=>x.difficulty===d);quiz=shuffle(eligible).slice(0,Math.min(n,eligible.length));index=0;score=0;results=[];}
function start(){makeQuiz();$("home").classList.add("hidden");$("result").classList.add("hidden");$("quiz").classList.remove("hidden");render();}
function render(){answered=false;$("next").disabled=true;$("feedback").textContent="";$("feedback").className="feedback";const q=quiz[index];$("counter").textContent=`Fråga ${index+1} av ${quiz.length}`;$("liveScore").textContent=`${score} rätt`;$("bar").style.width=`${index/quiz.length*100}%`;$("answers").innerHTML="";$("word").classList.add("hidden");$("sentence").classList.add("hidden");
if(selectedMode==="word"){$("questionType").textContent="Ordförståelse";$("word").classList.remove("hidden");$("word").textContent=q.word;let pool=BANK.filter(x=>x.word!==q.word&&x.difficulty===q.difficulty);if(pool.length<4)pool=BANK.filter(x=>x.word!==q.word);const opts=shuffle([{text:q.definition,correct:true},...shuffle(pool).slice(0,4).map(x=>({text:x.definition,correct:false}))]);opts.forEach(o=>addAnswer(o.text,o.correct,opts,q));}
else{$("questionType").textContent=`Meningskomplettering • ${labels[q.difficulty]}`;$("sentence").classList.remove("hidden");$("sentence").textContent=q.text;const opts=q.options.map((t,i)=>({text:t,correct:i===q.correct}));opts.forEach(o=>addAnswer(o.text,o.correct,opts,q));}}
function addAnswer(text,correct,opts,q){const b=document.createElement("button"),i=$("answers").children.length;b.className="answer";b.textContent=`${String.fromCharCode(65+i)}. ${text}`;b.onclick=()=>choose(b,{text,correct},q,opts);$("answers").appendChild(b);}
function choose(btn,opt,q,opts){if(answered)return;answered=true;const buttons=[...$("answers").children];buttons.forEach(b=>b.disabled=true);const right=selectedMode==="word"?q.definition:q.options[q.correct];if(opt.correct){score++;btn.classList.add("correct");$("feedback").textContent="✓ Rätt";$("feedback").classList.add("good");}else{btn.classList.add("wrong");$("feedback").textContent=`✗ Fel — rätt svar: ${right}`;$("feedback").classList.add("bad");const ci=opts.findIndex(x=>x.correct);if(ci>=0)buttons[ci].classList.add("correct");}results.push({title:selectedMode==="word"?q.word:q.text,selected:opt.text,correct:right,isCorrect:opt.correct});$("liveScore").textContent=`${score} rätt`;$("next").disabled=false;$("bar").style.width=`${(index+1)/quiz.length*100}%`;}
$("next").onclick=()=>{if(index<quiz.length-1){index++;render()}else finish();};
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}
function finish(){$("quiz").classList.add("hidden");$("result").classList.remove("hidden");const pct=Math.round(score/quiz.length*100);$("score").textContent=`${score}/${quiz.length}`;$("correctStat").textContent=score;$("wrongStat").textContent=quiz.length-score;$("percentStat").textContent=pct+"%";$("resultText").textContent=pct>=90?"Mycket starkt. Höj svårigheten eller kör ett längre test.":pct>=70?"Bra nivå. Rättningen visar exakt vad du behöver repetera.":"Fortsätt nöta. Fokusera särskilt på det du missade.";$("reviewList").innerHTML=results.map(r=>`<div class="review-item"><div class="review-word">${r.isCorrect?"✓":"✗"} ${esc(r.title)}</div><div class="review-answer">Ditt svar: <b>${esc(r.selected)}</b></div>${!r.isCorrect?`<div class="review-answer">Rätt svar: <b>${esc(r.correct)}</b></div>`:""}</div>`).join("");}
$("start").onclick=start;$("again").onclick=()=>{$("result").classList.add("hidden");$("home").classList.remove("hidden");updateInfo();};
</script></body></html>
