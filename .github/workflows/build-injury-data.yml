name: Build exact injury data

on:
  push:
    paths:
      - 'injury-chart/build_injury_data.py'
      - '.github/workflows/build-injury-data.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build exact dataset
        run: python injury-chart/build_injury_data.py
      - name: Commit generated dataset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add injury-chart/injury-data.json
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Build exact injury dataset [skip ci]'
            git push
          fi
